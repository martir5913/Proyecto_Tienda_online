$kind: http-request
url: "{{base_url}}/api/pedidos.php?action=checkout"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
queryParams:
  action: checkout
body:
  type: text
  content: |-
    {
      "csrf_token": "{{csrf_checkout}}",
      "id_metodo_pago": {{payment_method_id}},
      "direccion_envio": "Dirección de prueba",
      "notas": "Prueba desde Postman"
    }
order: 2000
