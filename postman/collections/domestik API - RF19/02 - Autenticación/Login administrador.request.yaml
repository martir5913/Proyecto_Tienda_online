$kind: http-request
url: "{{base_url}}/api/auth.php?action=login"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
queryParams:
  action: login
body:
  type: text
  content: |-
    {
      "correo": "{{admin_email}}",
      "password": "{{admin_password}}"
    }
order: 1000
