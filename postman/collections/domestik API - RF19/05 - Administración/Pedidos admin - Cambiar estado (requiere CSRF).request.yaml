$kind: http-request
url: "{{base_url}}/api/admin_pedidos.php?action=cambiar_estado"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  X-CSRF-Token: "{{csrf_admin_pedidos}}"
queryParams:
  action: cambiar_estado
body:
  type: text
  content: |-
    {
      "id_pedido": {{order_id}},
      "id_estado_pedido": 2
    }
order: 4000
